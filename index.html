<html lang="es" data-theme="light">
    <head>
        <meta charset="UFT-8">

<body>
    <!--Login-->
    <div id="login-wall">
    <div class="lw-box">
        <div class="lw-logo">Day<em>Flow</em>Pro</div>
        <div class="lw-sub">Tu organizador- accede o registrate</div>

        <div id="lw-status" style="display:none;text-align:center;padding:10px 0 6px">

            <div id="lw-status-msg" style="font-size:12.5px;color:var(--ink3)">Conectando...</div>
            <button id="lw-retry-btn" onclick="retryFbInit()" style="display:none;margin-top:10px;padding:8px 20px; background:var(--ink);color:var(--paper);border:none;border-radius:8px;font:inherit;font-size:12.5px;cursor:pointer"></button>
        </div>

        <div id="lw-form">
            <div class="lw-tabs">
                <button class="lw-tab on" id="lt-in" onclick="ltab('in')">Iniciar sesión</button>
                <button class="lw-tab " id="lt-reg" onclick="ltab('reg')">Registrarse</button>
        </div>
