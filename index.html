<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>DayFlow Pro</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        </head>
        <body>
            <div id="loginWall" class="login-wall">
                <section class="login-box">
                    <div>
                        <div class="kicker">Rutina diaria con XP</div>
                        <h1>DayFlow Pro</h1>
                        <p class="muted">Entra con tu usuario normal. DayFlow se encarga de proteger tu sesión.</p>
                    </div>
                    <div class="card grid">
                        <div class="field">
                            <label>Usuario</label>
                            <input id="loginUser" autocomplete="username" placeholder="tuusuario">
                        </div>
                        <div id="authError" class="muted"></div>
                        <div class="row">
                            <button id="loginBtn" class="btn" disabled>
                                <i class="fa-solid fa-right-to-bracket"></i>Entrar
                            </button>
                            <button id="regBtn" class="btn alt" disabled>
                                <i class="fa-solid fa-user-plus"></i>Crear cuenta
                            </button>
                        </div>
                    </div>
                </section>
            </div>

            <div class="app">
                <aside class="sidebar">
                    <button class="profile-entry" data-screen="stats" title="Estadisticas semanales">
                        <img id="sideAvatar" class="side-avatar" alt="Avatar">
                        <span id="sideName" class="profile-name">DayFlow</span>
                    </button>

                    <div class="rule"></div>

                    <button class="nav-item active" data-screen="dashboard" title="Dashboard">
                        <i class="fa-solid fa-house"></i>
                        <span class="label" data-i18n="dashboard">Dashboard</span>
                    </button>

                    <button class="nav-item" data-screen="modulos" title="Mis modulos">
                        <i class="fa-solid fa-puzzle-piece"></i>
                        <span class="label" data-i18n="modules">Mis Módulos</span>
                    </button>
                    <div id="moduleNav"></div>

                    <button class="nav-item" data-screen="recordatorios" title="Recordatorios">
                        <i class="fa-solid fa-bell"></i>
                        <span class="label" data-i18n="reminders">Recordatorios</span>
                    </button>

                    <div class="rule"></div>

                    <button class="nav-item locked" data-step="colegio" data-screen="colegio" title="Horario">
                        <i class="fa-solid fa-calendar-days"></i>
                        <span class="label" data-i18n="schedule">Horario</span>
                    </button>

                    <button class="nav-item locked" data-step="organizacion" data-screen="organizacion" title="Organización">
                        <i class="fa-solid fa-broom"></i>
                        <span class="label" data-i18n="organization">Organización</span>
                    </button>

                    <button class="nav-item locked" data-step="tareas" data-screen="tareas" title="Tareas">
                        <i class="fa-solid fa-book"></i>
                        <span class="label" data-i18n="tasks">Tareas</span>
                    </button>
